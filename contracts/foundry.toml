[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
solc_version = "0.8.24"
# The V4 engine needs 0.8.26 and the IR pipeline. It is skipped here rather
# than raising this profile's solc, because every already-deployed contract
# has published source pinned to 0.8.24 and a different compiler produces
# different bytecode — re-verifying any of them would stop matching.
# Globbed rather than listed file by file so a new V4 contract cannot break
# the default build by being forgotten here.
skip = ["src/Arcodian*.sol", "test/Arcodian*.t.sol", "script/DeployArcodian*.s.sol"]
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512

# Uniswap V4, added for the pool-at-launch engine. V4 needs a newer solc and
# the IR pipeline than the rest of this project builds with, so it gets its
# own profile rather than changing how every existing contract compiles —
# every deployed contract's bytecode has to keep matching its published
# source.
[profile.v4]
solc_version = "0.8.26"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# Its own artifact directory. Sharing `out` meant a v4 build silently
# rewrote every existing contract's artifact with 0.8.26/viaIR metadata —
# caught immediately, but it would have made the next verification of a
# deployed contract fail to match for no visible reason.
out = "out-v4"
# Profiles inherit from default, including its skip list — which would skip
# the very files this profile exists to build.
skip = []
